name: Dump Production Supabase Roles

on:
  workflow_dispatch:

jobs:
  dump-roles:
    name: Backup Production Roles (Read-Only PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: postgres:17

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Secret Existence
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::BLOCKED: SUPABASE_DB_URL secret missing"
            echo "Vui lòng cấu hình Repository Secret 'SUPABASE_DB_URL' trên GitHub trước khi kích hoạt workflow này."
            exit 1
          fi

      - name: Verify pg_dumpall Major Version 17
        run: |
          pg_dumpall --version
          PG_VER=$(pg_dumpall --version | awk '{print $3}' | cut -d. -f1)
          echo "Detected pg_dumpall major version: $PG_VER"
          if [ "$PG_VER" -ne 17 ]; then
            echo "::error::pg_dumpall major version is not 17! Current version output: $(pg_dumpall --version)"
            exit 1
          fi
          echo "PASS: pg_dumpall is major version 17."

      - name: Dump Production Roles (Read-Only Supabase CLI Equivalent Filter)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESERVED_ROLES: "anon|authenticated|authenticator|cli_login_.*|dashboard_user|pgbouncer|postgres|service_role|supabase_.*|pgsodium_keyholder|pgsodium_keyiduser|pgsodium_keymaker|pgtle_admin"
          ALLOWED_CONFIGS: "pgaudit.*|pgrst.*|session_replication_role|statement_timeout|track_io_timing"
          EXTRA_SED: "/^--/d"
        run: |
          echo "Đang dump roles khớp 100% với script dump_role.sh chính thức của Supabase CLI..."
          
          pg_dumpall --dbname="$SUPABASE_DB_URL" \
            --roles-only \
            --role "postgres" \
            --quote-all-identifier \
            --no-role-passwords \
            --no-comments \
          | sed -E 's/^\\(un)?restrict .*$/-- &/' \
          | sed -E "s/^CREATE ROLE \"($RESERVED_ROLES)\"/-- &/" \
          | sed -E "s/^ALTER ROLE \"($RESERVED_ROLES)\"/-- &/" \
          | sed -E "s/ (NOSUPERUSER|NOREPLICATION)//g" \
          | sed -E "s/^-- (.* SET \"($ALLOWED_CONFIGS)\" .*)/\1/" \
          | sed -E "s/GRANT \".*\" TO \"($RESERVED_ROLES)\"/-- &/" \
          | sed -E "${EXTRA_SED}" \
          | uniq > roles.sql

          echo "RESET ALL;" >> roles.sql

      - name: Verify roles.sql Content and Integrity
        env:
          RESERVED_ROLES: "anon|authenticated|authenticator|cli_login_.*|dashboard_user|pgbouncer|postgres|service_role|supabase_.*|pgsodium_keyholder|pgsodium_keyiduser|pgsodium_keymaker|pgtle_admin"
          ALLOWED_CONFIGS: "pgaudit.*|pgrst.*|session_replication_role|statement_timeout|track_io_timing"
        run: |
          if [ ! -f "roles.sql" ]; then
            echo "::error::File roles.sql không tồn tại sau khi dump!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "roles.sql" 2>/dev/null || stat -f%z "roles.sql" 2>/dev/null || echo 0)
          echo "Kích thước file roles.sql: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -le 0 ]; then
            echo "::error::File roles.sql bị rỗng (size = $FILE_SIZE bytes)!"
            exit 1
          fi

          # Kiểm tra dòng cuối cùng của roles.sql phải là RESET ALL;
          LAST_LINE=$(tail -n 1 roles.sql | tr -d '\r')
          if [ "$LAST_LINE" != "RESET ALL;" ]; then
            echo "::error::Dòng cuối của roles.sql không phải là 'RESET ALL;'. Dòng cuối hiện tại: '$LAST_LINE'"
            exit 1
          fi

          # Kiểm tra không còn các câu CREATE ROLE cho reserved roles
          INVALID_CREATE=$(grep -E "^CREATE ROLE \"($RESERVED_ROLES)\"" roles.sql || true)

          # Kiểm tra các câu ALTER ROLE cho reserved roles (chỉ cho phép SET đối với ALLOWED_CONFIGS)
          INVALID_ALTER=$(grep -E "^ALTER ROLE \"($RESERVED_ROLES)\"" roles.sql | grep -v -E "^ALTER ROLE \"($RESERVED_ROLES)\" SET \"?($ALLOWED_CONFIGS)\"?" || true)

          if [ -n "$INVALID_CREATE" ]; then
            echo "::error::Phát hiện câu lệnh CREATE ROLE cho reserved roles vẫn tồn tại trong roles.sql:"
            echo "$INVALID_CREATE"
            exit 1
          fi

          if [ -n "$INVALID_ALTER" ]; then
            echo "::error::Phát hiện câu lệnh ALTER ROLE không hợp lệ cho reserved roles trong roles.sql:"
            echo "$INVALID_ALTER"
            exit 1
          fi

          echo "PASS: roles.sql hợp lệ (tồn tại, size > 0, dòng cuối là RESET ALL;, không chứa CREATE ROLE cho reserved roles, và chỉ chứa ALTER ROLE SET hợp lệ)."

      - name: Upload roles.sql Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-roles
          path: roles.sql
          retention-days: 7
          if-no-files-found: error
