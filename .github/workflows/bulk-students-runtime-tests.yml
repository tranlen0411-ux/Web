name: Bulk Students Runtime Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "CREATE_IDEMPOTENCY_AND_RATE_LIMIT.sql"
      - "TEST_CONCURRENCY_ROW_CLAIM.sql"
      - "supabase/functions/student-quick-login/**"
      - "supabase/functions/admin-bulk-create-students/**"
      - "supabase/functions/admin-reset-student-pin/**"
      - "src/components/dashboard/ImportStudentsModal.jsx"
      - "supabase/tests/bulk-students/**"
      - ".github/workflows/bulk-students-runtime-tests.yml"

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.15.8

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Frontend (Vite)
        run: npm run build

      - name: Deno Check Edge Functions
        run: |
          deno check supabase/functions/student-quick-login/index.ts
          deno check supabase/functions/admin-bulk-create-students/index.ts
          deno check supabase/functions/admin-reset-student-pin/index.ts

      - name: Start Supabase Local Engine
        run: supabase start

      - name: Load Fixture SQL (Local PostgreSQL Only)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/bulk-students/00_fixture.sql

      - name: Apply Migration SQL (Local PostgreSQL Only)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f CREATE_IDEMPOTENCY_AND_RATE_LIMIT.sql

      - name: Execute Database SQL Tests (Local PostgreSQL Only)
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/bulk-students/database_test.sql

      - name: Prepare Local Secrets File
        run: |
          PEPPER_VAL="$(openssl rand -hex 32)"
          echo "IP_HASH_PEPPER=${PEPPER_VAL}" > supabase/.env.local
          echo "ALLOW_PRODUCTION_BULK_CREATE=true" >> supabase/.env.local
          echo "JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long" >> supabase/.env.local

          SERVICE_ROLE_JWT=$(deno eval '
            const encoder = new TextEncoder();
            const secret = "super-secret-jwt-token-with-at-least-32-characters-long";
            const header = { alg: "HS256", typ: "JWT" };
            const payload = { role: "service_role", iss: "supabase", iat: 1577328000, exp: 1892904000 };
            const b64Url = (obj) => btoa(JSON.stringify(obj)).replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
            const h = b64Url(header);
            const p = b64Url(payload);
            const key = await crypto.subtle.importKey("raw", encoder.encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
            const sig = await crypto.subtle.sign("HMAC", key, encoder.encode(`${h}.${p}`));
            const s = btoa(String.fromCharCode(...new Uint8Array(sig))).replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
            console.log(`${h}.${p}.${s}`);
          ')
          echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_JWT}" >> supabase/.env.local

      - name: Serve Edge Functions & Execute Runtime Tests
        run: |
          # Bắt đầu serve Edge Functions trong background trên runner ubuntu-latest local
          supabase functions serve student-quick-login --env-file supabase/.env.local &
          supabase functions serve admin-bulk-create-students --env-file supabase/.env.local &
          supabase functions serve admin-reset-student-pin --env-file supabase/.env.local &

          # Chờ Edge Functions gateway khởi động
          sleep 5

          # Thực thi bộ test tự động thực tế với Deno
          deno test --allow-net --allow-env --allow-read supabase/tests/bulk-students/runtime_test.ts

      - name: Stop Supabase Local Engine
        if: always()
        run: supabase stop --no-backup
