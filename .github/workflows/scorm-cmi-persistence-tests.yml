name: SCORM CMI Persistence Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/scorm-cmi-persistence-tests.yml'
      - 'scripts/test_scorm_cmi_persistence.js'
      - 'supabase/migrations/**scorm**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-cmi-persistence:
    name: SCORM CMI Persistence Tests (PGlite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run SCORM CMI persistence tests
        run: node scripts/test_scorm_cmi_persistence.js
