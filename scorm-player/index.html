<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCORM Isolated Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #player-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    #scorm-content-frame {
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
      flex: 1;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: rgba(15, 23, 42, 0.95);
      color: #ffffff;
      z-index: 10;
      padding: 24px;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .error-box {
      background-color: #7f1d1d;
      border: 1px solid #ef4444;
      border-radius: 12px;
      padding: 20px 28px;
      max-width: 450px;
    }
    .error-title {
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 8px;
      color: #fca5a5;
    }
  </style>
</head>
<body>
  <div id="player-container">
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="overlay">
      <div class="spinner"></div>
      <p style="font-size: 15px; color: #94a3b8;">Đang khởi tạo môi trường bài học SCORM...</p>
    </div>

    <!-- Error Overlay (Hidden by default) -->
    <div id="error-overlay" class="overlay" style="display: none;">
      <div class="error-box">
        <div class="error-title">⚠️ Không thể mở bài học</div>
        <p id="error-message" style="font-size: 14px; color: #fee2e2;">Đã xảy ra lỗi khi nạp nội dung gói SCORM.</p>
      </div>
    </div>

    <!-- Isolated SCO Content Frame (Same origin as player wrapper for API discovery) -->
    <iframe
      id="scorm-content-frame"
      name="scormContentFrame"
      sandbox="allow-scripts allow-same-origin allow-forms allow-downloads"
      allow="fullscreen; autoplay"
    ></iframe>
  </div>

  <script type="module" src="./src/player.js"></script>
</body>
</html>
