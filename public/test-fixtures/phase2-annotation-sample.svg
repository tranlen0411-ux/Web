<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" style="background:#ffffff; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <!-- Paper Background & Grid Lines -->
  <rect width="800" height="1100" fill="#ffffff" />
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="1100" fill="url(#grid)" />
  
  <!-- Outer Paper Border -->
  <rect x="20" y="20" width="760" height="1060" rx="8" fill="none" stroke="#cbd5e1" stroke-width="2" />
  <line x1="100" y1="20" x2="100" y2="1080" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="4,4" />

  <!-- Header -->
  <text x="400" y="70" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e293b">PHIẾU BÀI TẬP TOÁN TIỂU HỌC</text>
  <text x="400" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">Chủ đề: Phép Cộng Trừ &amp; Hình Học Trong Phạm Vi 20</text>
  
  <text x="120" y="130" font-size="13" fill="#334155"><tspan font-weight="bold">Họ và tên:</tspan> Nguyễn Văn Nam (Mẫu Test)</text>
  <text x="450" y="130" font-size="13" fill="#334155"><tspan font-weight="bold">Lớp:</tspan> 1A - Trường Học Vui</text>
  <line x1="40" y1="145" x2="760" y2="145" stroke="#94a3b8" stroke-width="1.5" />

  <!-- Question 1 -->
  <g transform="translate(120, 180)">
    <rect x="-10" y="-18" width="620" height="110" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="0" y="5" font-size="15" font-weight="bold" fill="#0f172a">Bài 1 (2 điểm): Tính nhẩm các phép tính sau:</text>
    <text x="20" y="40" font-size="15" font-weight="600" fill="#334155">a) 8 + 5 = 13</text>
    <text x="200" y="40" font-size="15" font-weight="600" fill="#334155">b) 14 - 6 = 8</text>
    <text x="380" y="40" font-size="15" font-weight="600" fill="#334155">c) 9 + 7 = 16</text>
    <text x="20" y="75" font-size="15" font-weight="600" fill="#334155">d) 17 - 9 = 8</text>
    <text x="200" y="75" font-size="15" font-weight="600" fill="#334155">e) 12 + 6 = 18</text>
    <text x="380" y="75" font-size="15" font-weight="600" fill="#334155">g) 20 - 5 = 15</text>
  </g>

  <!-- Question 2 -->
  <g transform="translate(120, 320)">
    <rect x="-10" y="-18" width="620" height="150" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="0" y="5" font-size="15" font-weight="bold" fill="#0f172a">Bài 2 (3 điểm): Điền dấu (&gt;, &lt;, =) thích hợp vào chỗ chấm:</text>
    <text x="20" y="40" font-size="15" fill="#334155">a) 7 + 6 ... 15 - 3</text>
    <text x="20" y="70" font-size="14" font-weight="600" fill="#2563eb">   Lời giải: 13 &gt; 12</text>
    
    <text x="250" y="40" font-size="15" fill="#334155">b) 18 - 8 ... 9 + 1</text>
    <text x="250" y="70" font-size="14" font-weight="600" fill="#2563eb">   Lời giải: 10 = 10</text>
    
    <text x="20" y="110" font-size="15" fill="#334155">c) 9 + 4 ... 8 + 6</text>
    <text x="20" y="135" font-size="14" font-weight="600" fill="#dc2626">   Lời giải: 13 &gt; 14  (Học sinh tính nhầm)</text>
  </g>

  <!-- Question 3 -->
  <g transform="translate(120, 500)">
    <rect x="-10" y="-18" width="620" height="230" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="0" y="5" font-size="15" font-weight="bold" fill="#0f172a">Bài 3 (3 điểm): Bài toán có lời văn:</text>
    <text x="0" y="32" font-size="14" fill="#334155">Đàn gà nhà bạn An có 14 con gà mái và 5 con gà trống.</text>
    <text x="0" y="54" font-size="14" fill="#334155">Hỏi đàn gà nhà bạn An có tất cả bao nhiêu con gà?</text>
    
    <!-- Student Handwritten Solution Simulation -->
    <text x="240" y="90" font-size="15" font-weight="bold" fill="#1e293b" text-decoration="underline">Bài giải</text>
    <text x="40" y="125" font-size="14" font-style="italic" fill="#1e3a8a">Số con gà đàn gà nhà An có tất cả là:</text>
    <text x="140" y="155" font-size="16" font-weight="bold" fill="#1e3a8a">14 + 5 = 19 (con gà)</text>
    <text x="220" y="190" font-size="15" font-style="italic" fill="#1e3a8a">Đáp số: 19 con gà</text>
  </g>

  <!-- Question 4 Geometry -->
  <g transform="translate(120, 760)">
    <rect x="-10" y="-18" width="620" height="260" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="0" y="5" font-size="15" font-weight="bold" fill="#0f172a">Bài 4 (2 điểm): Hình học trực quan:</text>
    <text x="0" y="30" font-size="14" fill="#334155">Quan sát hình vẽ và cho biết hình bên có bao nhiêu hình tam giác?</text>
    
    <!-- Geometry Shapes -->
    <g transform="translate(40, 50)">
      <!-- Large Triangle ABC -->
      <polygon points="120,10 20,150 220,150" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" />
      <!-- Median line AD -->
      <line x1="120" y1="10" x2="120" y2="150" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="3,3" />
      <text x="115" y="0" font-size="13" font-weight="bold" fill="#0369a1">A</text>
      <text x="5" y="165" font-size="13" font-weight="bold" fill="#0369a1">B</text>
      <text x="115" y="170" font-size="13" font-weight="bold" fill="#0369a1">D</text>
      <text x="225" y="165" font-size="13" font-weight="bold" fill="#0369a1">C</text>
    </g>

    <!-- Student Answer -->
    <g transform="translate(300, 80)">
      <text x="0" y="20" font-size="14" fill="#334155">Học sinh trả lời:</text>
      <text x="0" y="50" font-size="15" font-weight="bold" fill="#1e3a8a">- Hình bên có 3 hình tam giác:</text>
      <text x="20" y="75" font-size="14" fill="#1e3a8a">+ Hình tam giác ABD</text>
      <text x="20" y="98" font-size="14" fill="#1e3a8a">+ Hình tam giác ADC</text>
      <text x="20" y="121" font-size="14" fill="#1e3a8a">+ Hình tam giác ABC</text>
    </g>
  </g>
</svg>
